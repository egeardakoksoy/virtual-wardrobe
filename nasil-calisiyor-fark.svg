<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fark-title fark-desc">
          <title id="fark-title">Kıyafeti kesmiyoruz, farkı alıyoruz</title>
          <desc id="fark-desc">Giydirilmemiş ve giydirilmiş manken görüntüleri karşılaştırılıyor; değişen pikseller kıyafetin kendisi olduğu için şeffaf katman doğrudan bu farktan çıkarılıyor.</desc>
          <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
            <marker id="arrow2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
            <marker id="arrow2-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          </defs>

          <rect width="100%" height="100%" fill="#f5f5f5"/>

          <!-- ===== ARROWS ===== -->
          <!-- Önce -> Farkı al (dirsek aşağı, kendi tutunma noktası) -->
          <path d="M 300,100 H 364 Q 372,100 372,108 V 140 Q 372,148 380,148 H 440"
                fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow2)"/>
          <!-- Sonra -> Farkı al (dirsek yukarı, ayrı tutunma noktası) -->
          <path d="M 300,220 H 364 Q 372,220 372,212 V 180 Q 372,172 380,172 H 440"
                fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow2)"/>
          <!-- Farkı al -> Katman -->
          <line x1="616" y1="160" x2="756" y2="160" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow2-accent)"/>
          <rect x="650" y="132" width="72" height="12" rx="2" fill="#f5f5f5"/>
          <text x="686" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEĞİŞEN PİKSEL</text>

          <!-- ===== NODES ===== -->
          <!-- Önce -->
          <rect x="76" y="64" width="224" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="76" y="64" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="188" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Önce: boş manken</text>
          <text x="188" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hep aynı fotoğraf</text>

          <!-- Sonra -->
          <rect x="76" y="184" width="224" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="76" y="184" width="224" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="188" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sonra: giydirilmiş hâli</text>
          <text x="188" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">yapay zekânın çıktısı</text>

          <!-- Farkı al — FOKAL -->
          <rect x="440" y="124" width="176" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="440" y="124" width="176" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
          <text x="528" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">İkisini karşılaştır</text>
          <text x="528" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kendi algoritmam</text>

          <!-- Katman -->
          <rect x="756" y="124" width="176" height="72" rx="6" fill="#f5f5f5"/>
          <rect x="756" y="124" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="844" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Şeffaf katman</text>
          <text x="844" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sadece kıyafet kalır</text>

          <!-- ===== LEGEND ===== -->
          <line x1="32" y1="316" x2="968" y2="316" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
          <text x="32" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">MANTIK</text>
          <text x="140" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MANKEN SABİT → DEĞİŞEN HER ŞEY KIYAFETİN KENDİSİDİR · BU DİYAGRAMDA API ÇAĞRISI YOK</text>
        </svg>
